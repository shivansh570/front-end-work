<!DOCTYPE html>
<html>
<head>
<title>Calculator</title>

<style>
body{
  font-family:Arial, sans-serif;
  background-color:#fdf1df;
  margin:0;
  padding:20px;
}

h1{
  background-color:#8b4513;
  color:white;
  text-align:center;
  padding:20px;
  margin:0;
  border-radius:8px;
}

.container{
  width:90%;
  max-width:400px;
  margin:30px auto;
  background:#fffaf0;
  padding:25px;
  border-radius:12px;
  box-shadow:0 4px 15px rgba(90,50,20,0.2);
}

label{
  display:block;
  margin:15px 0 7px;
  color:#8b4513;
  font-weight:bold;
}

input{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  border:2px solid #d6a77a;
  border-radius:6px;
  font-size:16px;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:20px;
}

button{
  padding:12px;
  border:none;
  border-radius:6px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.04);
}

.add{
  background:#386641;
  color:white;
}

.subtract{
  background:#c58b5b;
  color:white;
}

.multiply{
  background:#8b4513;
  color:white;
}

.divide{
  background:#6b705c;
  color:white;
}

.reset{
  background:#e8c6a5;
  color:#5c3317;
  width:100%;
  margin-top:12px;
}

.result{
  background:#dce8d5;
  color:#386641;
  padding:15px;
  border-radius:6px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
  margin-top:20px;
}
</style>
</head>

<body>

<h1>Calculator</h1>

<div class="container">

<label>Enter First Number:</label>
<input type="number" id="num1" placeholder="Enter first number">

<label>Enter Second Number:</label>
<input type="number" id="num2" placeholder="Enter second number">

<div class="buttons">

<button class="add" onclick="add()">Addition (+)</button>
<button class="subtract" onclick="subtract()">Subtraction (-)</button>
<button class="multiply" onclick="multiply()">Multiplication (*)</button>
<button class="divide" onclick="divide()">Division (/)</button>

</div>

<div class="result" id="result">
Calculate
</div>

<button class="reset" onclick="reset()">Reset</button>

</div>

<script>

function getNumbers(){
  let a = document.getElementById("num1").value;
  let b = document.getElementById("num2").value;

  if(a === "" || b === ""){
    document.getElementById("result").innerHTML = "Please enter both numbers.";
    return null;
  }

  return [Number(a), Number(b)];
}

function add(){
  let numbers = getNumbers();
  if(numbers === null) return;

  let result = numbers[0] + numbers[1];
  document.getElementById("result").innerHTML = "Result: " + result;
}

function subtract(){
  let numbers = getNumbers();
  if(numbers === null) return;

  let result = numbers[0] - numbers[1];
  document.getElementById("result").innerHTML = "Result: " + result;
}

function multiply(){
  let numbers = getNumbers();
  if(numbers === null) return;

  let result = numbers[0] * numbers[1];
  document.getElementById("result").innerHTML = "Result: " + result;
}

function divide(){
  let numbers = getNumbers();
  if(numbers === null) return;

  if(numbers[1] === 0){
    document.getElementById("result").innerHTML = "Cannot divide by zero!";
    return;
  }

  let result = numbers[0] / numbers[1];
  document.getElementById("result").innerHTML = "Result: " + result;
}

function reset(){
  document.getElementById("num1").value = "";
  document.getElementById("num2").value = "";
  document.getElementById("result").innerHTML = "Calculate";
}

</script>

</body>
</html>
