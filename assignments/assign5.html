
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>General Knowledge Quiz</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #eef2ff;
            margin: 0;
            padding: 30px 15px;
            color: #1e293b;
        }

        .quiz-container {
            max-width: 650px;
            margin: 50px auto;
            padding: 35px;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
            text-align: center;
        }

        h1 {
            color: #4338ca;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }

        .quiz-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-weight: bold;
        }

        #timer {
            color: #dc2626;
            background-color: #fee2e2;
            padding: 9px 14px;
            border-radius: 8px;
        }

        .progress-bar {
            height: 9px;
            background-color: #e2e8f0;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        #progress {
            width: 10%;
            height: 100%;
            background-color: #4f46e5;
            transition: width 0.3s;
        }

        #question {
            font-size: 21px;
            margin-bottom: 25px;
            line-height: 1.5;
            text-align: left;
        }

        #options {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background-color: #f8fafc;
            cursor: pointer;
            text-align: left;
        }

        .option:hover {
            background-color: #e0e7ff;
            border-color: #6366f1;
        }

        .option:has(input:checked) {
            background-color: #e0e7ff;
            border-color: #4f46e5;
        }

        .option input {
            accent-color: #4f46e5;
            cursor: pointer;
        }

        #nextBtn {
            width: 100%;
            margin-top: 30px;
            padding: 14px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #nextBtn:hover {
            background-color: #3730a3;
        }

        #result {
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
            color: #15803d;
            line-height: 1.7;
        }

        @media (max-width: 500px) {

            .quiz-container {
                padding: 22px 17px;
                margin: 15px auto;
            }

            h1 {
                font-size: 24px;
            }

            #question {
                font-size: 18px;
            }

            .quiz-info {
                font-size: 13px;
            }

        }

    </style>

</head>

<body>

    <div class="quiz-container">

        <h1>General Knowledge Quiz</h1>

        <p class="subtitle">
            Test your knowledge with these 10 questions!
        </p>

        <div class="quiz-info">

            <p id="questionNumber">Question 1 of 10</p>

            <p id="timer">Time Left: 30s</p>

        </div>

        <div class="progress-bar">
            <div id="progress"></div>
        </div>

        <div id="questionBox">

            <h2 id="question">Question will appear here</h2>

            <div id="options"></div>

        </div>

        <button id="nextBtn">Next Question</button>

        <div id="result"></div>

    </div>


    <script>

        const questions = [

            {
                question: "Which is the capital of India?",
                options: ["Mumbai", "New Delhi", "Kolkata", "Chennai"],
                answer: 1
            },

            {
                question: "Which planet is known as the Red Planet?",
                options: ["Earth", "Jupiter", "Mars", "Venus"],
                answer: 2
            },

            {
                question: "Who is known as the Father of the Nation in India?",
                options: ["Jawaharlal Nehru", "Mahatma Gandhi", "Sardar Patel", "Subhas Chandra Bose"],
                answer: 1
            },

            {
                question: "How many days are there in a leap year?",
                options: ["365", "366", "364", "360"],
                answer: 1
            },

            {
                question: "Which is the largest ocean in the world?",
                options: ["Atlantic Ocean", "Indian Ocean", "Arctic Ocean", "Pacific Ocean"],
                answer: 3
            },

            {
                question: "Which gas do plants absorb from the atmosphere?",
                options: ["Oxygen", "Nitrogen", "Carbon Dioxide", "Hydrogen"],
                answer: 2
            },

            {
                question: "Who wrote the Indian National Anthem?",
                options: ["Rabindranath Tagore", "Bankim Chandra Chatterjee", "Sarojini Naidu", "Premchand"],
                answer: 0
            },

            {
                question: "Which is the smallest prime number?",
                options: ["1", "2", "3", "5"],
                answer: 1
            },

            {
                question: "Which is the national animal of India?",
                options: ["Lion", "Elephant", "Bengal Tiger", "Leopard"],
                answer: 2
            },

            {
                question: "How many continents are there in the world?",
                options: ["5", "6", "7", "8"],
                answer: 2
            }

        ];


        let currentQuestion = 0;

        let selectedAnswers = new Array(questions.length).fill(null);

        let timeLeft = 30;
        let timerInterval;


        const questionNumber = document.getElementById("questionNumber");
        const timer = document.getElementById("timer");
        const question = document.getElementById("question");
        const options = document.getElementById("options");
        const nextBtn = document.getElementById("nextBtn");
        const result = document.getElementById("result");
        const progress = document.getElementById("progress");


        function showQuestion() {

            const q = questions[currentQuestion];

            questionNumber.textContent =
                "Question " + (currentQuestion + 1) + " of " + questions.length;

            question.textContent = q.question;

            options.innerHTML = "";

            q.options.forEach(function(option, index) {

                const label = document.createElement("label");
                label.className = "option";

                const radio = document.createElement("input");

                radio.type = "radio";
                radio.name = "answer";
                radio.value = index;

                if (selectedAnswers[currentQuestion] === index) {
                    radio.checked = true;
                }

                radio.addEventListener("change", function() {
                    selectedAnswers[currentQuestion] = index;
                });

                const text = document.createElement("span");
                text.textContent = option;

                label.appendChild(radio);
                label.appendChild(text);

                options.appendChild(label);

            });

            progress.style.width =
                ((currentQuestion + 1) / questions.length) * 100 + "%";

            if (currentQuestion === questions.length - 1) {
                nextBtn.textContent = "Submit Quiz";
            } else {
                nextBtn.textContent = "Next Question";
            }

            startTimer();

        }


        function startTimer() {

            clearInterval(timerInterval);

            timeLeft = 30;

            timer.textContent = "Time Left: " + timeLeft + "s";

            timerInterval = setInterval(function() {

                timeLeft--;

                timer.textContent = "Time Left: " + timeLeft + "s";

                if (timeLeft <= 0) {

                    clearInterval(timerInterval);

                    goToNextQuestion();

                }

            }, 1000);

        }


        function goToNextQuestion() {

            clearInterval(timerInterval);

            if (currentQuestion === questions.length - 1) {

                submitQuiz();

            } else {

                currentQuestion++;

                showQuestion();

            }

        }


        function submitQuiz() {

            clearInterval(timerInterval);

            let score = 0;

            questions.forEach(function(q, index) {

                if (selectedAnswers[index] === q.answer) {
                    score++;
                }

            });

            document.getElementById("questionBox").style.display = "none";

            nextBtn.style.display = "none";

            questionNumber.textContent = "Quiz Completed!";

            timer.textContent = "Submitted";

            result.innerHTML =
                "Quiz Submitted Successfully!<br>" +
                "Your Score: " + score + " / " + questions.length;

        }


        nextBtn.addEventListener("click", goToNextQuestion);


        showQuestion();

    </script>

</body>
</html>
