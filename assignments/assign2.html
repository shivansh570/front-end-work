<!DOCTYPE html>
<html>
<head>
<title>CampusConnect - Student Registration Portal</title>

<style>
body{
  font-family: Arial, sans-serif;
  background-color: #f4f7f6;
  color: #333;
  margin:0;
  padding:20px;
}

.container{
  max-width:800px;
  margin:20px auto;
  background:white;
  padding:30px;
  border-radius:8px;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

header{
  text-align:center;
  border-bottom:3px solid #2c3e50;
  padding-bottom:15px;
  margin-bottom:30px;
}

h1{
  color:#2c3e50;
  margin:0 0 10px;
  font-size:32px;
}

.highlight-box{
  background:#e8f4fd;
  padding:15px;
  margin-bottom:25px;
  border-radius:4px;
  color:#2980b9;
  font-weight:bold;
}

fieldset{
  border:1px solid #ccc;
  border-radius:6px;
  padding:20px;
  margin-bottom:25px;
}

legend{
  font-weight:bold;
  color:#2c3e50;
  padding:0 10px;
  font-size:18px;
}

label{
  font-weight:bold;
  font-size:14px;
}

input, select, textarea{
  width:100%;
  padding:10px;
  margin-top:5px;
  margin-bottom:15px;
  border:1px solid #ccc;
  border-radius:4px;
  box-sizing:border-box;
}

input[type="checkbox"], input[type="radio"]{
  width:auto;
  margin:5px;
}

.checkbox-group, .radio-group{
  margin-top:10px;
  margin-bottom:15px;
}

.checkbox-group label, .radio-group label{
  font-weight:normal;
  margin-right:12px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.form-actions{
  text-align:right;
  border-top:1px solid #ccc;
  padding-top:20px;
}

button{
  padding:12px 24px;
  margin:5px;
  font-size:15px;
  font-weight:bold;
  border:none;
  border-radius:4px;
  cursor:pointer;
}

button[type="submit"]{
  background:#2ecc71;
  color:white;
}

button[type="reset"]{
  background:#e74c3c;
  color:white;
}

footer{
  text-align:center;
  margin-top:30px;
  font-size:14px;
  color:#7f8c8d;
}
</style>
</head>

<body>

<div class="container">

<header>
<h1>CampusConnect</h1>
<p>Student Information Collection Portal</p>
</header>

<form id="registrationForm" onsubmit="return validateForm(event)">

<fieldset>
<legend>Personal & Contact Information</legend>

<label>Full Name *</label>
<input type="text" id="fullName" name="fullName" placeholder="Enter your name" required>

<label>Date of Birth *</label>
<input type="date" id="dob" name="dob" required>

<label>Gender *</label>
<select id="gender" name="gender" required>
<option value="" disabled selected>Select Gender</option>
<option value="male">Male</option>
<option value="female">Female</option>
<option value="other">Other</option>
<option value="prefer-not-to-say">Prefer not to say</option>
</select>

<label>Email Address *</label>
<input type="email" id="email" name="email" placeholder="xyz@gmail.com" required>

<label>Mobile Number *</label>
<input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>

<label>Password *</label>
<input type="password" id="password" name="password" minlength="8" required>

<label>Confirm Password *</label>
<input type="password" id="confirmPassword" name="confirmPassword" minlength="8" required>

<label>Profile Photo *</label>
<input type="file" id="profilePhoto" name="profilePhoto" accept="image/*" required>

</fieldset>

<fieldset>
<legend>Academic Information</legend>

<label>University Roll Number *</label>
<input type="text" id="rollNumber" name="rollNumber" placeholder="Enter your roll number" required>

<label>Course Name *</label>
<select id="course" name="course" required>
<option value="" disabled selected>Select Course</option>
<option value="btech">B.Tech (Computer Science)</option>
<option value="bca">BCA</option>
<option value="bsc">B.Sc Hons. Computer Science</option>
<option value="bms">BMS</option>
<option value="bba">BBA-FIA</option>
<option value="mba">MBA</option>
<option value="mtech">MTECH</option>
</select>

<label>Semester *</label>
<select id="semester" name="semester" required>
<option value="" disabled selected>Select Semester</option>
<option value="1">Semester 1</option>
<option value="2">Semester 2</option>
<option value="3">Semester 3</option>
<option value="4">Semester 4</option>
<option value="5">Semester 5</option>
<option value="6">Semester 6</option>
<option value="7">Semester 7</option>
<option value="8">Semester 8</option>
</select>

<label>Previous Academic Percentage (%) *</label>
<input type="number" id="percentage" name="percentage" min="0" max="100" step="0.01" placeholder="e.g. 85.50" required>

<label>Preferred Subjects * (Select all that apply)</label>

<div class="checkbox-group">
<label><input type="checkbox" name="subjects" value="ip"> Informatics Practice</label>
<label><input type="checkbox" name="subjects" value="sk"> Sanskrit</label>
<label><input type="checkbox" name="subjects" value="abh"> Art of Being Happy</label>
<label><input type="checkbox" name="subjects" value="evs"> Environmental Studies</label>
<label><input type="checkbox" name="subjects" value="en"> English</label>
<label><input type="checkbox" name="subjects" value="os"> Japanese</label>
<label><input type="checkbox" name="subjects" value="eco"> Economics</label>
<label><input type="checkbox" name="subjects" value="acc"> Accounting</label>
<label><input type="checkbox" name="subjects" value="fed"> Front End Development</label>
</div>

<label>Mode of Study *</label>

<div class="radio-group">
<label><input type="radio" name="studyMode" value="regular" checked required> Regular</label>
<label><input type="radio" name="studyMode" value="hybrid"> Hybrid</label>
<label><input type="radio" name="studyMode" value="distance"> Distance</label>
</div>

</fieldset>

<fieldset>
<legend>Additional Information</legend>

<label>Permanent Address *</label>
<textarea id="address" name="address" placeholder="Enter your complete Home Address" required></textarea>

<label>City *</label>
<input type="text" id="city" name="city" placeholder="e.g. New Delhi" required>

<label>State *</label>
<input type="text" id="state" name="state" placeholder="e.g. Delhi" required>

<label>PIN Code *</label>
<input type="text" id="pinCode" name="pinCode" placeholder="6-digit code" pattern="[0-9]{6}" required>

<label>Why do you want to join this programme?</label>
<textarea id="statement" name="statement"></textarea>

</fieldset>

<div class="form-actions">
<button type="reset">Reset Form</button>
<button type="submit">Submit Registration</button>
</div>

</form>

<footer>
Student Registration Portal
</footer>

</div>

<script>
function validateForm(event){

  event.preventDefault();

  const subjects = document.querySelectorAll('input[name="subjects"]:checked');

  if(subjects.length === 0){
    alert("Please select at least one preferred subject!");
    return false;
  }

  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if(password !== confirmPassword){
    alert("Passwords do not match! Please try again.");
    return false;
  }

  alert("Registration Submitted Successfully!");

  return false;
}
</script>

</body>
</html>
